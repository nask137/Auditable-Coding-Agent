spring.application.name=auditable-coding-agent

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


agent.loop.max-steps=20
agent.loop.max-tool-calls=50
agent.loop.max-file-changes=5
agent.loop.max-patch-lines=300
agent.loop.max-consecutive-failures=3
agent.loop.max-model-retries=2
agent.loop.max-replan-attempts=2
agent.loop.max-user-input-requests-per-run=3
agent.command.timeout-seconds=120
agent.file.max-read-bytes=200000

# LLM provider.
# Use "stub" for deterministic local/runtime tests, or "http" for the
# DeepSeek/OpenAI-compatible chat-completions gateway.
agent.llm.provider=${AGENT_LLM_PROVIDER:stub}
agent.llm.base-url=${AGENT_LLM_BASE_URL:https://api.deepseek.com}
agent.llm.api-key=${AGENT_LLM_API_KEY:}
agent.llm.model=${AGENT_LLM_MODEL:deepseek-v4-pro}
agent.llm.timeout-seconds=${AGENT_LLM_TIMEOUT_SECONDS:60}
agent.llm.max-tokens=${AGENT_LLM_MAX_TOKENS:4096}
agent.llm.temperature=${AGENT_LLM_TEMPERATURE:0.1}
agent.llm.thinking.enabled=${AGENT_LLM_THINKING_ENABLED:false}
agent.llm.reasoning-effort=${AGENT_LLM_REASONING_EFFORT:high}
