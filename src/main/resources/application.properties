spring.application.name=auditable-coding-agent

spring.datasource.url=${AGENT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agent}
spring.datasource.username=${AGENT_DATASOURCE_USERNAME:codex}
spring.datasource.password=${AGENT_DATASOURCE_PASSWORD:codex}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true

agent.loop.max-steps=20
agent.loop.max-tool-calls=50
agent.loop.max-file-changes=5
agent.loop.max-patch-lines=300
agent.loop.max-consecutive-failures=3
agent.command.timeout-seconds=120
agent.file.max-read-bytes=200000
